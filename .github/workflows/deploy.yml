# Publicação do site www.processovivo.com.br (kit v1.0.3)
# A cada push na main, envia os arquivos do site para o servidor (CyberPanel) por SSH + rsync.
# Segredos necessários (Settings > Secrets and variables > Actions):
#   SSH_HOST  - IP ou nome do servidor
#   SSH_PORT  - porta do SSH (normalmente 22)
#   SSH_USER  - usuário do próprio site no CyberPanel (ex.: proce1234). Não use root.
#   SSH_KEY   - chave privada SSH (conteúdo inteiro do arquivo, com as linhas BEGIN/END)
#   SITE_DIR  - pasta do site no servidor (ex.: /home/processovivo.com.br/public_html)
#   SITE_OWNER - opcional: só se SSH_USER for root (não recomendado)
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: publicar-site
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Conferir se os segredos já foram cadastrados
        id: cfg
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SITE_DIR: ${{ secrets.SITE_DIR }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_KEY" ] || [ -z "$SITE_DIR" ]; then
            echo "::warning::Segredos ainda não cadastrados (SSH_HOST, SSH_KEY, SITE_DIR). Nada foi publicado. Veja COMO-ATUALIZAR.md, parte 2."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Conferir que o index.html existe
        if: steps.cfg.outputs.ok == 'true'
        run: test -s index.html

      - name: Preparar a chave SSH
        if: steps.cfg.outputs.ok == 'true'
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Enviar os arquivos (rsync)
        if: steps.cfg.outputs.ok == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SITE_DIR: ${{ secrets.SITE_DIR }}
          SITE_OWNER: ${{ secrets.SITE_OWNER }}
        run: |
          OWNER_OPT=""
          if [ -n "$SITE_OWNER" ]; then OWNER_OPT="--chown=$SITE_OWNER:$SITE_OWNER"; fi
          # Sem --delete: arquivos que existem só no servidor (ex.: .well-known do SSL) não são apagados.
          rsync -rltvz --checksum $OWNER_OPT \
            --chmod=D755,F644 \
            --exclude '.git/' --exclude '.github/' --exclude 'README.md' --exclude 'COMO-ATUALIZAR.md' --exclude 'LEIA-ME.md' --exclude '.gitignore' --exclude '*.zip' \
            -e "ssh -i ~/.ssh/id_deploy -p ${SSH_PORT:-22}" \
            ./ "$SSH_USER@$SSH_HOST:${SITE_DIR%/}/"

      - name: Limpar a chave
        if: always()
        run: rm -f ~/.ssh/id_deploy
